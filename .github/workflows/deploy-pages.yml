name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_MONTY_API_URL: https://monty-api.huxiaoheng.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/build
      - run: npx vite build --base / --outDir ../artifacts/build-root
        working-directory: frontend
        env:
          VITE_MONTY_API_URL: https://monty-api.huxiaoheng.com
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: huxiaoheng44/huxiaoheng44.github.io
          publish_branch: main
          publish_dir: artifacts/build-root
          keep_files: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "sync from xiaoheng-web-v3@${{ github.sha }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
